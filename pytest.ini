[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
markers =
    integration: tests requiring both ERP and AI_TM stub running
    slow: tests that take more than a second
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
