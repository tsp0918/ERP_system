version: "3.9"

# PostgreSQLでローカル動作させたい場合に使用。
# SQLiteで十分な場合は不要 (.env の DATABASE_URL がデフォルトでSQLite)。

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - erp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  erp-pgdata:
